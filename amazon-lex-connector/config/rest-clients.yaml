# yaml-language-server: $schema=https://json-schema.axonivy.com/14.0-dev/config/rest-clients-2.json
RestClients:
  #Amazon Lex is a service for building conversational interfaces into any application using voice and text. 
  #Amazon Lex provides the advanced deep learning functionalities of automatic speech recognition (ASR)
  #for converting speech to text, and natural language understanding (NLU) to recognize the intent of the text, 
  #to enable you to build applications with highly engaging user experiences and lifelike conversational interactions. 
  #With Amazon Lex, the same deep learning technologies that power Amazon Alexa are now available 
  #to any developer, enabling you to quickly and easily build sophisticated, natural language, conversational bots (“chatbots”).
  Amazon-Lex-Amazon-Lex-Runtime-V2:
    Name: Amazon Lex (Amazon Lex Runtime V2)
    Url: https://runtime-v2-lex.eu-central-1.amazonaws.com
    Icon: res:/webContent/icons/AmazonLex.png
    Features:
      - ch.ivyteam.ivy.rest.client.mapper.JsonFeature
      - com.axonivy.connector.aws.authentication.Aws4AuthenticationFeature
    Properties:
      serviceName: lex
      accessKey: ${ivy.var.Amazon.Lex.AccessKey}
      secretKey: ${ivy.var.Amazon.Lex.SecretKey}
    OpenAPI:
      SpecUrl: /mnt/data/dev/core/master/workspace/ch.ivyteam.ivy.designer.configuration.tests/test/ch/ivyteam/ivy/designer/webserviceui/restricted/codegen/res/openapi-2.yaml
      Namespace: com.amazonaws.lex.runtime.v2
    LegacyUUID: 13f7783c-cd64-4625-a663-82b504bd4195
